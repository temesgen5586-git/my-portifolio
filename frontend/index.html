<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Full-Stack Web Developer & Software Engineering Student — building modern, scalable web applications."
    />
    <meta name="theme-color" content="#0A1A1A" />
    <title>Portfolio — Full Stack Developer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Theme bootstrap (prevents flash of wrong theme) -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('portfolio-theme') || 'dark';
          document.documentElement.className = theme;
        } catch (e) {
          document.documentElement.className = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
